name: CI

on:
  push:
    branches: [canary]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: stable
      - name: build
        run: go build ./...
      - name: test
        run: go test -race ./...
      - name: go mod tidy check
        if: runner.os != 'Windows'
        run: go mod tidy -diff

  wasm:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: stable
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
      - uses: ./.github/actions/setup-binaryen
      - name: build wasm + npm package and test
        run: make js-test
      # The Node tests above run the Node bundle. This is the only coverage of
      # the bundle browsers actually load, including the fetch and
      # instantiateStreaming path.
      - name: install chromium
        run: cd js && npx playwright install --with-deps chromium
      - name: browser tests
        run: cd js && npm run test:browser
      - name: report wasm size
        run: |
          ls -lh js/dist/downmark.wasm
          echo "gzipped: $(gzip -c js/dist/downmark.wasm | wc -c) bytes"
      - name: wasm_exec.js drift check
        run: git diff --exit-code js/vendor

  # The npm package ships the native binary in six per-platform packages
  # built from goreleaser's output. Assembling them here means a break in
  # that path shows up on the pull request, not on the release that was
  # going to publish them.
  npm-packages:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: stable
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
      - name: build every release binary
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          version: '~> v2'
          args: build --snapshot --clean
      - name: stage and check the per-platform npm packages
        run: .github/scripts/check-npm-packages.sh

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: stable
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: latest

  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: stable
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  fuzz-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: stable
      - name: fuzz 30s per target
        run: |
          set -euo pipefail
          go test -fuzz '^FuzzConvert$' -fuzztime 30s ./internal/docx
          go test -fuzz '^FuzzConvert$' -fuzztime 30s ./internal/pptx
