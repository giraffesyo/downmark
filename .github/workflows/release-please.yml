name: release-please

on:
  push:
    branches: [canary]

permissions:
  contents: read

jobs:
  # Prove the release artifacts actually build and pass their tests before
  # anything is tagged or published. Everything below depends on this, so a
  # broken commit can never leave a dangling tag or a half-published release.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: stable
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: lts/*
      - uses: ./.github/actions/setup-binaryen
      - name: go tests
        run: go test ./...
      - name: wasm build and npm package tests
        run: make js-test
      # Build every release target without publishing, so a goreleaser or
      # cross-compilation break surfaces here rather than mid-release.
      - name: goreleaser build
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          version: '~> v2'
          args: build --snapshot --clean

  # Maintains the release PR on ordinary pushes; on the merge of that PR it
  # bumps the version, writes the changelog, tags, and creates the release.
  release-please:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # release commit, tag, and GitHub release
      pull-requests: write # open and update the release PR
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Only runs when release-please actually cut a release. Publishing lives in
  # this workflow rather than a tag-triggered one because a tag pushed with
  # GITHUB_TOKEN never fires another workflow -- and keeping it here means the
  # verify gate above always precedes it.
  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # upload release assets
      id-token: write # OIDC for npm trusted publishing
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The tag points at the commit verify already validated.
          ref: ${{ needs.release-please.outputs.tag_name }}
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: stable
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: lts/*
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm >= 11.5.1. Node LTS bundles a newer npm
      # than that, so nothing is installed here on purpose: pulling an
      # unpinned npm from the network into the job that holds the OIDC token
      # would be a needless supply-chain step. Fail loudly if that stops
      # being true rather than publishing with a too-old client.
      - name: check npm supports trusted publishing
        run: |
          set -euo pipefail
          need=11.5.1
          have=$(npm --version)
          printf '%s\n' "$need" "$have" | sort -V -C \
            || { echo "npm $have is older than $need; pin a newer node-version"; exit 1; }
          echo "npm $have"
      - uses: ./.github/actions/setup-binaryen

      # goreleaser adds binaries to the release release-please already
      # created; .goreleaser.yaml pins mode: keep-existing so its notes survive.
      - name: goreleaser release
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: build the npm package
        run: make js VERSION="${TAG#v}"
      # release-please already committed this version; --allow-same-version
      # keeps npm from failing on what is normally a no-op bump.
      - name: sync package version to the tag
        run: cd js && npm version --no-git-tag-version --allow-same-version "${TAG#v}"
      # No NODE_AUTH_TOKEN: auth comes from the OIDC id-token, and npm
      # generates provenance automatically for trusted publishes.
      - name: publish to npm
        run: cd js && npm publish --access public
      - name: attach npm artifacts to the GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd js && npm pack --pack-destination "$RUNNER_TEMP" && cd ..
          gh release upload "$TAG" \
            "$RUNNER_TEMP"/giraffesyo-downmark-*.tgz \
            js/dist/downmark.wasm \
            js/vendor/wasm_exec.js \
            --clobber
