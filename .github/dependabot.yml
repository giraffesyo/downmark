version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  # Build-time only: these never ship to consumers, but they do execute in
  # the workflow that publishes to npm.
  - package-ecosystem: npm
    directory: /js
    schedule:
      interval: weekly
