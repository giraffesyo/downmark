version: 2

project_name: downmark

builds:
  - main: ./cmd/downmark
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

release:
  # release-please creates the GitHub release and writes its notes from the
  # changelog, so goreleaser must only add artifacts to it. keep-existing is
  # already the default; it is spelled out because the notes now depend on it.
  mode: keep-existing

checksum:
  name_template: checksums.txt

changelog:
  use: github-native
