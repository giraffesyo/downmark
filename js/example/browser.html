<!doctype html>
<!--
  Manual browser check for @giraffesyo/downmark. Build first, then serve the
  js/ directory with any static server and open this page:

    make js            # from the repo root
    npx serve js       # or: python3 -m http.server -d js 8000

  Then visit http://localhost:3000/example/browser.html and drop a file.
-->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>downmark browser demo</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 60rem; margin: 2rem auto; padding: 0 1rem; }
    #drop { border: 2px dashed #999; border-radius: 8px; padding: 3rem; text-align: center; color: #555; }
    #drop.over { border-color: #333; color: #000; }
    pre { background: #f5f5f5; padding: 1rem; border-radius: 8px; overflow-x: auto; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>downmark</h1>
  <p id="status">Loading wasm…</p>
  <div id="drop">Drop a document here (PDF, DOCX, XLSX, PPTX, DOC, HTML, CSV, ZIP…) or <input type="file" id="picker" /></div>
  <h2 id="title"></h2>
  <pre id="out"></pre>
  <script type="module">
    import { convert, init, version } from "../dist/index.browser.js";

    const status = document.getElementById("status");
    const drop = document.getElementById("drop");
    const out = document.getElementById("out");
    const titleEl = document.getElementById("title");

    try {
      await init();
      status.textContent = `Ready (downmark ${await version()})`;
    } catch (err) {
      status.textContent = `Failed to load wasm: ${err.message}`;
      throw err;
    }

    async function handle(file) {
      status.textContent = `Converting ${file.name}…`;
      out.textContent = "";
      titleEl.textContent = "";
      try {
        const data = new Uint8Array(await file.arrayBuffer());
        const result = await convert(data, { filename: file.name });
        titleEl.textContent = result.title;
        out.textContent = result.markdown;
        status.textContent = `Converted ${file.name}`;
      } catch (err) {
        status.textContent = `Error (${err.code ?? "?"}): ${err.message}`;
      }
    }

    drop.addEventListener("dragover", (e) => { e.preventDefault(); drop.classList.add("over"); });
    drop.addEventListener("dragleave", () => drop.classList.remove("over"));
    drop.addEventListener("drop", (e) => {
      e.preventDefault();
      drop.classList.remove("over");
      if (e.dataTransfer.files.length) handle(e.dataTransfer.files[0]);
    });
    document.getElementById("picker").addEventListener("change", (e) => {
      if (e.target.files.length) handle(e.target.files[0]);
    });
  </script>
</body>
</html>
